[project]
name = "fun-sentence-splitter"
version = "0.4.3814.20260724"
description = "A fundamental sentence splitter based on spacy."
authors = [{ name = "Medical AI Engineering", email = "engineering@m-ai.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "spacy==3.8.14",
    "click>=8.0,<9.0",  # workaround for spacy#13971 (spacy imports click, typer 0.27 no longer pulls it); drop once spacy declares it
]

[dependency-groups]
dev = [
    "ruff>=0.15.0,<0.16.0",
    "mypy>=2.0.0,<3.0.0",
    "pytest>=8.4.2,<9.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    # update needs newer spacy version
    "typer>=0.27.0,<0.28.0",
    "tqdm>=4.67.0,<5.0.0",  # used by the eval script (transitively via spacy; declared explicitly)
    "types-tqdm>=4.67.0.20250809,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fun_sentence_splitter"]

[tool.mypy]
pretty = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[tool.ruff]
line-length = 120
exclude = [".venv"]

# these rule prefixes are used
lint.select = [
    "A", "B", "C", "E", "F", "G", "I", "N", "Q", "S", "T", "W",
    "ANN", "ARG",
    "BLE",
    "COM",
    "DJ", "DTZ",
    "EM", "ERA", "EXE",
    "FBT",
    "ICN", "INP", "ISC",
    "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI",
    "RET", "RSE", "RUF", "SIM", "SLF",
    "TCH", "TID", "TRY",
    "UP",
    "YTT",
]

lint.ignore = [
    "EM101",  # string literals in exceptions
    "TRY003",  # custom messages for internal exceptions
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # allow assertions
]
"tests/evaluate_sentence_splitter.py" = [
    "T201", # allow print
]
