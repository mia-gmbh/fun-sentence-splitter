name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run linting
        run: uv run --locked ruff check .
      - name: Run type checking
        run: uv run --locked mypy .
      - name: Download spacy model
        run: uv run --locked python -m spacy download de_core_news_sm
      - name: Run tests
        run: uv run --locked pytest --cov=fun_sentence_splitter
      - name: Generate SBOM
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --format requirements.txt -o requirements-sbom.txt
          uvx --from cyclonedx-bom==7.4.0 cyclonedx-py requirements requirements-sbom.txt --spec-version 1.6 --output-format json --output-file sbom.cdx.json
      - name: Keep SBOM as workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sbom-fun-sentence-splitter
          path: sbom.cdx.json

  upload-sbom:
    # the build runs on GitHub-hosted runners, which cannot reach the internal Dependency-Track;
    # the upload therefore runs on a self-hosted runner from the build's artifact
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPENDENCY_TRACK_URL != ''
    runs-on: [self-hosted, Linux, prod]
    # Inventory, not a release criterion
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: sbom-fun-sentence-splitter
      - name: Upload SBOM to Dependency-Track
        env:
          SERVER_URL: ${{ vars.DEPENDENCY_TRACK_URL }}
          API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
        run: |
          set -euo pipefail
          header_file="$(mktemp)"
          chmod 600 "$header_file"
          trap 'rm -f "$header_file"' EXIT
          printf 'X-Api-Key: %s\n' "$API_KEY" > "$header_file"
          curl --silent --show-error --fail-with-body -X POST "${SERVER_URL%/}/api/v1/bom" \
            -H "@$header_file" \
            -F autoCreate=true \
            -F "projectName=${GITHUB_REPOSITORY#*/}" \
            -F "projectVersion=$GITHUB_REF_NAME" \
            -F bom=@sbom.cdx.json
