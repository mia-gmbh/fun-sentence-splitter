name: publish

on:
  workflow_run:
    workflows: ["build"]
    branches: [main]
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC trusted publishing (no long-lived token)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Skip if version is already on PyPI
        id: version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -fsSL -o /dev/null "https://pypi.org/pypi/fun-sentence-splitter/$VERSION/json"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is already on PyPI - skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is new - publishing."
          fi
      - name: Build and publish to pypi
        if: steps.version.outputs.published == 'false'
        run: |
          uv build
          uv publish --trusted-publishing always
