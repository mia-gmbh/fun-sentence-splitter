name: publish

on:
  workflow_run:
    workflows: ["build"]
    branches: [main]
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Skip if version is already on PyPI
        id: version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -fsSL -o /dev/null "https://pypi.org/pypi/fun-sentence-splitter/$VERSION/json"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is already on PyPI - skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is new - publishing."
          fi
      - name: Build and publish to pypi
        if: steps.version.outputs.published == 'false'
        uses: JRubics/poetry-publish@4b3306307f536bbfcb559603629b3b4f6aef5ab8 # v2.1
        with:
          pypi_token: ${{ secrets.PYPI_TOKEN }}
